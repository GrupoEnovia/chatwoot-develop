# Chatwoot-Agenda-Inteligente — imagem customizada (docker/Dockerfile).
#
# --- Portainer em Docker Swarm ---
# O Swarm IGNORA "build" e "restart" e EXIGE "image:". Erro "no image specified"
# removemos antes ao tirar a linha image; ela precisa existir.
#
# Antes do redeploy (SSH na VPS, pasta do clone do stack, ex.: /data/compose/N/):
#   docker compose -f docker-compose.production.yaml build
#   docker tag <id ou nome gerado> chatwoot-agenda-inteligente:production
# Em geral o build já aplica a tag se "image" estiver no YAML — então:
#   docker compose -f docker-compose.production.yaml build
# verifique: docker images | grep chatwoot-agenda-inteligente
#
# Aviso "ignoring IP-address 127.0.0.1": no Swarm a porta pode publicar em 0.0.0.0;
# restrinja com firewall ou proxy reverso.
#
# --- docker compose "standalone" (sem Swarm) ---
# build + image juntos: primeiro build gera a tag local; "restart" vale (deploy é ignorado).
#
version: '3'

# Extensão: não vira container; só reutiliza bloco YAML em rails e sidekiq.
x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: chatwoot-agenda-inteligente:production
  env_file: env.deploy ## versionado para deploy Git/Portainer; copie para .env local se preferir desenvolvimento
  volumes:
    - storage_data:/app/storage

services:
  rails:
    <<: *app
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always
    deploy:
      restart_policy:
        condition: any

  sidekiq:
    <<: *app
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always
    deploy:
      restart_policy:
        condition: any

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      # Igual ao POSTGRES_PASSWORD em env.deploy / .env da app.
      - POSTGRES_PASSWORD=ddRWz0s69wEq1eQJd8Lc
    deploy:
      restart_policy:
        condition: any

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: env.deploy
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    deploy:
      restart_policy:
        condition: any

volumes:
  storage_data:
  postgres_data:
  redis_data:
