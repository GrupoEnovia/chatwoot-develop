# Chatwoot-Agenda-Inteligente — app customizada (docker/Dockerfile).
#
# --- Swarm / Portainer (sem build no YAML) ---
# Imagem padrão abaixo é LOCAL: chatwoot-agenda-inteligente:production
# OBRIGATÓRIO na VPS (pasta do clone do stack), antes do redeploy, UMA VEZ ou após mudar Dockerfile:
#   docker compose -f docker-compose.production.yaml build --no-cache
# (No manager do Swarm; se tiver workers, todo nó que rodar rails/sidekiq precisa da mesma imagem.)
#
# --- GHCR depois (opcional) ---
# Quando o workflow Actions publicar com sucesso, você pode trocar "image" abaixo para:
#   ghcr.io/grupoenovia/chatwoot-develop:production
# e no Portainer cadastrar o registry GHCR se o pacote for privado.
#
# Aviso Swarm "ignoring 127.0.0.1": portas podem ir para 0.0.0.0 — firewall/proxy.
#
version: '3'

# Extensão: não vira container; só reutiliza bloco YAML em rails e sidekiq.
x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: chatwoot-agenda-inteligente:production
  env_file: env.deploy ## versionado para deploy Git/Portainer; copie para .env local se preferir desenvolvimento
  volumes:
    - storage_data:/app/storage

services:
  rails:
    <<: *app
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always
    deploy:
      restart_policy:
        condition: any

  sidekiq:
    <<: *app
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always
    deploy:
      restart_policy:
        condition: any

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      # Igual ao POSTGRES_PASSWORD em env.deploy / .env da app.
      - POSTGRES_PASSWORD=ddRWz0s69wEq1eQJd8Lc
    deploy:
      restart_policy:
        condition: any

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: env.deploy
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    deploy:
      restart_policy:
        condition: any

volumes:
  storage_data:
  postgres_data:
  redis_data:
