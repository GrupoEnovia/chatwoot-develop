# Chatwoot-Agenda-Inteligente — imagem só existe depois do build local (docker/Dockerfile).
# Sem linha "image:" aqui: o Compose gera o nome da imagem (ex.: stack_rails) e não tenta
# baixar chatwoot-agenda-inteligente:production da internet.
#
# Portainer NÃO constrói a imagem sozinho na maioria dos deploys: antes do redeploy,
# na VPS (SSH), entre na pasta do clone do stack e rode UMA VEZ:
#   docker compose -f docker-compose.production.yaml build
#   docker compose -f docker-compose.production.yaml up -d
# Depois disso o redeploy no Portainer costuma funcionar (imagem já existe localmente).
#
# Stack em modo Swarm: "build" no compose é ignorado — use CI + registry ou faça build na VM.
# (Validador Compose v3 do Portainer: sem pull_policy.)
version: '3'

# Extensão: não vira container; só reutiliza bloco YAML em rails e sidekiq.
x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file: env.deploy ## versionado para deploy Git/Portainer; copie para .env local se preferir desenvolvimento
  volumes:
    - storage_data:/app/storage

services:
  rails:
    <<: *app
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *app
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      # Igual ao POSTGRES_PASSWORD em env.deploy / .env da app.
      - POSTGRES_PASSWORD=ddRWz0s69wEq1eQJd8Lc

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: env.deploy
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'

volumes:
  storage_data:
  postgres_data:
  redis_data:
