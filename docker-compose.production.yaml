# Chatwoot-Agenda-Inteligente — imagem gerada a partir DESTE repositório (docker/Dockerfile).
# Clone na VPS: git clone https://github.com/GrupoEnovia/chatwoot-develop.git
# Não usa chatwoot/chatwoot do Docker Hub. Build: docker compose -f docker-compose.production.yaml build
version: '3'

services:
  base: &base
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: chatwoot-agenda-inteligente:production
    env_file: env.deploy ## versionado para deploy Git/Portainer; copie para .env local se preferir desenvolvimento
    volumes:
      - storage_data:/app/storage

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      # Igual ao POSTGRES_PASSWORD em env.deploy / .env da app.
      - POSTGRES_PASSWORD=ddRWz0s69wEq1eQJd8Lc

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: env.deploy
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'

volumes:
  storage_data:
  postgres_data:
  redis_data:
