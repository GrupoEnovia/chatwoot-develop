# Imagem usada por docker-compose.production.yaml (rails + sidekiq).
# Docker Swarm / Portainer não executam "build" do compose — precisam dar pull
# de um registry (GHCR). Rode este workflow com push em main/develop ou manualmente.
#
# Pacote: Settings → Actions → General → Workflow permissions: Read and write.

name: Publish Agenda Inteligente image (GHCR)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docker/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/publish_agenda_inteligente_ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name (GHCR exige minúsculas)
        id: meta
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):production" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.IMAGE }}
          platforms: linux/amd64
