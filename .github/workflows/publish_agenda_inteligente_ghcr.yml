# Publica a mesma imagem que o Swarm usa como CHATWOOT_APP_IMAGE (GHCR).
# IMPORTANTE: todo push em main/develop roda o job — sem filtro de paths — para a tag
# ghcr.io/...:production existir mesmo quando só mudam yaml/env/deploy.

name: Publish Agenda Inteligente image (GHCR)

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-agenda-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name (GHCR exige minúsculas)
        id: meta
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):production" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.IMAGE }}
          platforms: linux/amd64
