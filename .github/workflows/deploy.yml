name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        run: |
          fail=0
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "::error::Defina o secret do repositório VPS_HOST (IP ou hostname da VPS, sem espaços)."
            fail=1
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "::error::Defina o secret do repositório VPS_USER (usuário SSH, ex.: root, ubuntu, deploy)."
            fail=1
          fi
          if [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "::error::Defina o secret do repositório SSH_KEY (chave privada PEM completa, linhas BEGIN/END OPENSSH/PRIVATE KEY)."
            fail=1
          fi
          exit "$fail"

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t volps/chatwoot:latest .

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Remove CRLF (chaves copiadas do Windows quebram o OpenSSH)
          echo "${{ secrets.SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Host obrigatório; falha de rede não aborta o job (o ssh abaixo usa StrictHostKeyChecking=no)
          HOST="${{ secrets.VPS_HOST }}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Transfer image to VPS
        run: |
          docker save volps/chatwoot:latest | gzip | \
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "docker load"

      # Nomes no Swarm = nome da stack no Portainer + "_" + serviço (ex.: chatwoot-agenda-inteligente_rails).
      # Opcional: Settings → Secrets and variables → Actions → Variables → SWARM_STACK_NAME (nome da stack no Portainer, sem _rails)
      - name: Deploy and migrate on VPS
        uses: appleboy/ssh-action@v1
        env:
          SWARM_STACK_NAME: ${{ vars.SWARM_STACK_NAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 15m
          envs: SWARM_STACK_NAME
          script: |
            set -e

            # Default alinhado ao stack name no Portainer (docker-compose project name)
            STACK="${SWARM_STACK_NAME:-chatwoot-agenda-inteligente}"
            RAILS_SVC="${STACK}_rails"
            SIDEKIQ_SVC="${STACK}_sidekiq"

            echo "=== Stack prefix: $STACK (serviços: $RAILS_SVC, $SIDEKIQ_SVC) ==="
            if ! docker service inspect "$RAILS_SVC" >/dev/null 2>&1; then
              echo "ERRO: serviço Swarm '$RAILS_SVC' não existe."
              echo "No Portainer, confira o nome da stack e crie a variable SWARM_STACK_NAME no GitHub (mesmo prefixo, sem _rails)."
              echo "Serviços atuais:"
              docker service ls || true
              exit 1
            fi

            echo "=== Deploying stack (force update to pick up new image) ==="
            docker service update --force --image volps/chatwoot:latest "$RAILS_SVC"
            docker service update --force --image volps/chatwoot:latest "$SIDEKIQ_SVC"

            echo "=== Waiting for new rails container to be running ==="
            MIGRATED=0
            for i in $(seq 1 24); do
              TASK_ID=$(docker service ps "$RAILS_SVC" \
                --filter desired-state=running \
                --format "{{.ID}}" 2>/dev/null | head -1)

              if [ -n "$TASK_ID" ]; then
                CONTAINER_ID=$(docker inspect "$TASK_ID" \
                  --format '{{.Status.ContainerStatus.ContainerID}}' 2>/dev/null | head -c 12)

                if [ -n "$CONTAINER_ID" ] && [ "${#CONTAINER_ID}" -ge "10" ]; then
                  echo "Container found: $CONTAINER_ID (attempt ${i})"
                  if docker exec "$CONTAINER_ID" bundle exec rails db:migrate 2>&1; then
                    MIGRATED=1
                    break
                  fi
                fi
              fi

              echo "Waiting for container to be ready... (${i}/24)"
              sleep 10
            done

            if [ "$MIGRATED" -eq "0" ]; then
              echo "WARNING: Could not run migrations via service task. Trying docker ps fallback..."
              for i in $(seq 1 5); do
                RAILS_ID=$(docker ps --filter "name=${STACK}_rails" --filter status=running \
                  --format "{{.ID}}" | head -1)
                if [ -n "$RAILS_ID" ]; then
                  docker exec "$RAILS_ID" bundle exec rails db:migrate && break
                fi
                sleep 10
              done
            fi

            echo "=== Cleaning old images ==="
            docker image prune -f

            echo "=== Deploy complete ==="
